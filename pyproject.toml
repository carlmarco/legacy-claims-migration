[project]
name = "etl"
version = "0.1.0"
description = "Generic legacy-to-Postgres migration engine with validation and load-strategy benchmarks"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
