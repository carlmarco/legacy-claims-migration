services:
  postgres:
    image: postgres:16
    # Bulk loads write several GB of WAL per merge; at the 1GB default, checkpoints are forced
    # mid-merge (113 requested vs 47 timed). Spacing them doesn't weaken durability. See D26.
    command: ["postgres", "-c", "max_wal_size=4GB"]
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: target
    ports:
      - "5433:5432"   # 5433 on host to avoid clashing with any local Postgres
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d target"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
